name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS solo al fusionar a master o a mano: las pruebas no usan el simulador y los runners de Mac tardan en asignarse.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Solo el servidor y las pruebas: las apps de ejemplo piden los workloads de MAUI.
      - run: dotnet build src/Driftcheck.Mcp -c Release
      - run: dotnet test tests/Driftcheck.Tests -c Release
