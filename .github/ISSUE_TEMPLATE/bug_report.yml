name: Bug report
description: Something in a capture, comparison or report is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What Driftcheck reported, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The MCP tool and arguments you used (remove tokens and private URLs).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android emulator
        - Android device
        - iOS Simulator
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: App framework
      placeholder: .NET MAUI, Android views, Compose, UIKit, SwiftUI, Flutter…
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Driftcheck version or commit, OS, device / simulator and screen size
  - type: textarea
    id: report
    attributes:
      label: Report
      description: If you can share it, attach report.md, report.html or diff.png. Don't attach designs or screens you're not allowed to share.
