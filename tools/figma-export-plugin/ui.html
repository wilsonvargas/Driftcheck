<style>
  body { font: 12px sans-serif; margin: 12px; }
  textarea { width: 100%; height: 240px; font: 11px monospace; }
  code { background: #eee; padding: 1px 3px; }
  .error { color: #c00; }
</style>
<div id="info">Exportando…</div>
<textarea id="json" readonly></textarea>
<p>
  <button id="download" disabled>Descargar</button>
  <button id="copy" disabled>Copiar</button>
</p>
<script>
  let data;
  onmessage = (event) => {
    data = event.data.pluginMessage;
    const info = document.getElementById("info");
    if (data.error) {
      info.className = "error";
      info.textContent = data.error;
      return;
    }
    info.innerHTML = `Frame <b></b> (${data.nodeId}). Guárdalo como<br>` +
      `<code>%TEMP%\\driftcheck\\cache\\${data.fileName}</code>`;
    info.querySelector("b").textContent = data.nodeName;
    document.getElementById("json").value = data.json;
    document.getElementById("download").disabled = false;
    document.getElementById("copy").disabled = false;
  };

  document.getElementById("download").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data.json], { type: "application/json" }));
    a.download = data.fileName;
    a.click();
  };

  document.getElementById("copy").onclick = () => {
    const area = document.getElementById("json");
    area.select();
    document.execCommand("copy");
  };
</script>
