    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a20; --border: #2a2f38; --text: #e9ecf1; --muted: #9aa3af;
      --ok: #34c17f; --bad: #f08a3c; --missing: #f0636a; --expected: #6b93ff; --accent: #6b93ff;
      --chip: #222731; --code: #222731; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 600; color: var(--muted); font-size: 13px; letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
  .brand img { width: 16px; height: 16px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .score { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .ring { width: 64px; height: 64px; }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--chip); }
  .ring .value { stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s ease; }
  .ring text { font-size: 17px; font-weight: 700; fill: var(--text); text-anchor: middle; dominant-baseline: central; }
  .score-label { font-weight: 600; }
  .delta { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .delta.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .delta.down { color: var(--missing); background: color-mix(in srgb, var(--missing) 14%, transparent); }
  .delta.same { color: var(--muted); background: var(--chip); }
  .counts { color: var(--muted); font-size: 13px; }
  .warnings { margin: 16px 24px 0; display: grid; gap: 8px; }
  .warning {
    padding: 10px 14px; border-radius: var(--radius); font-size: 13px;
    border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent);
    background: color-mix(in srgb, var(--bad) 10%, var(--surface));
  }
  .warning strong { color: var(--bad); margin-right: 6px; }
  .counts b { color: var(--text); font-weight: 600; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding: 16px 24px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .segmented { display: inline-flex; background: var(--chip); border-radius: 6px; padding: 2px; }
  .segmented button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 5px 12px; border-radius: 5px; cursor: pointer;
  }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .segmented button:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .toolbar input[type=range] { width: 140px; accent-color: var(--accent); }
  .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  .viewer { display: flex; justify-content: center; gap: 16px; padding: 16px; }
  .frame { position: relative; height: min(76vh, 900px); aspect-ratio: var(--ar); flex: none; user-select: none; }
  .frame img, .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame img { border-radius: 4px; outline: 1px solid var(--border); }
  .tag {
    position: absolute; top: 8px; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;
    background: rgba(20, 23, 28, .72); color: #fff; pointer-events: none;
  }
  .tag.left { left: 8px; } .tag.right { right: 8px; }

  #designFrame { display: none; }
  .viewer.side #designFrame { display: block; }
  .viewer.side .frame { height: min(70vh, 820px); }
  #designTop, #diffImg, .handle, .tag.right, .tag.left.overlay { display: none; }
  .viewer.slider #designTop, .viewer.opacity #designTop { display: block; }
  .viewer.slider #designTop { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .viewer.slider .handle, .viewer.slider .tag.right, .viewer.slider .tag.left.overlay { display: block; }
  .viewer.diff #diffImg { display: block; }
  .handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); cursor: ew-resize; }
  .handle::after {
    content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #14171c;
    display: grid; place-items: center; font-size: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .slider .frame#mainFrame { cursor: ew-resize; }

  svg.boxes rect { fill: transparent; vector-effect: non-scaling-stroke; stroke-width: 2; cursor: pointer; transition: opacity .15s; }
  svg.boxes rect.ok { stroke: var(--ok); }
  svg.boxes rect.differs { stroke: var(--bad); stroke-width: 2.5; }
  svg.boxes rect.missing { stroke: var(--missing); stroke-dasharray: 6 4; }
  svg.boxes rect.expected { stroke: var(--expected); stroke-dasharray: 6 4; pointer-events: none; }
  svg.boxes.hidden rect:not(.selected) { opacity: 0; }
  svg.boxes.focus rect:not(.selected) { opacity: .2; }
  svg.boxes rect.selected { stroke-width: 3.5; fill: color-mix(in srgb, currentColor 8%, transparent); }
  .viewer.diff svg.boxes rect:not(.selected) { opacity: 0; }

  aside { display: flex; flex-direction: column; max-height: calc(76vh + 74px); }
  .filters { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filters button {
    border: 1px solid var(--border); background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--chip); color: var(--text); border-color: transparent; font-weight: 600; }
  .list { overflow: auto; padding: 8px; }
  .item { padding: 10px 12px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .item + .item { margin-top: 4px; }
  .item:hover { background: var(--chip); }
  .item.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .item-head { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.differs { background: var(--bad); } .dot.missing { background: var(--missing); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .id { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--muted); background: var(--chip); padding: 0 6px; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 2px 6px 2px 0; }
  td { padding: 2px 6px 2px 0; vertical-align: top; overflow-wrap: anywhere; }
  td:first-child { color: var(--muted); width: 32%; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; outline: 1px solid var(--border); }
  .fix { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--code); font-size: 13px; }
  .fix + .fix { margin-top: 4px; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
  .empty { padding: 24px 12px; text-align: center; color: var(--muted); }
  footer { padding: 0 24px 24px; color: var(--muted); font-size: 12px; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

 Figma layer is 24\u00D724)"},{"name":"Line (x=35, y=459.5)","id":null,"status":"ok","expected":[91.875,1212.3125,343.12499999999994,2.625],"actual":[91.99999999999999,1209.9999999999998,344,3],"diffs":[],"fix":null},{"name":"Line (x=255, y=459.5)","id":null,"status":"ok","expected":[645,1212.3125,343.12499999999994,2.625],"actual":[646,1209.9999999999998,343,3],"diffs":[],"fix":null},{"name":"Shape \u0022Enter your email\u0022","id":null,"status":"ok","expected":[91.875,1308.125,896.2499999999999,141.75],"actual":[92.99999999999999,1307,894.9999999999999,140],"diffs":[],"fix":null},{"name":"Shape \u0022Enter your password\u0022","id":null,"status":"ok","expected":[91.875,1554.8749999999998,896.2499999999999,120.75],"actual":[91.99999999999999,1554,897,121],"diffs":[],"fix":null},{"name":"Shape \u0022Sign up\u0022","id":null,"status":"differs","expected":[91.875,1738.6249999999998,896.2499999999999,144.375],"actual":[91.99999999999999,1738,897,145],"diffs":[{"property":"background","figma":"#DBC6F8","app":"#BAD1BB","fix":"\u0060BackgroundColor=\u0022#9E56FF\u0022\u0060 (it renders as #DBC6F8 in the design: the layer or a container has opacity)"}],"fix":null}]};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Las sugerencias vienen en markdown simple: solo `código`.
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const value = v => /^#[0-9A-F]{6}$/i.test(v) ? `<span class="swatch" style="background:${v}"></span>${esc(v)}` : esc(v);

// Encabezado y puntaje
$("title").textContent = data.title;
$("meta").textContent = [data.device, data.app, data.date].filter(Boolean).join(" · ");
if (data.warnings.length) {
  $("warnings").hidden = false;
  $("warnings").innerHTML = data.warnings.map(w => `<div class="warning" role="alert"><strong>Warning</strong>${md(w)}</div>`).join("");
}
const count = s => data.elements.filter(e => e.status === s).length;
const f = data.fidelity;
if (f.total > 0) {
  const color = f.percent >= 90 ? "var(--ok)" : f.percent >= 70 ? "var(--bad)" : "var(--missing)";
  const c = 2 * Math.PI * 26;
  const change = f.previous == null ? "" : f.percent === f.previous
    ? `<span class="delta same">same as before</span>`
    : `<span class="delta ${f.percent > f.previous ? "up" : "down"}">${f.percent > f.previous ? "+" : "−"}${Math.abs(f.percent - f.previous)} from ${f.previous} %</span>`;
  $("score").innerHTML = `
    <svg class="ring" viewBox="0 0 64 64" role="img" aria-label="Fidelity ${f.percent} %">
      <circle class="track" cx="32" cy="32" r="26"/>
      <circle class="value" cx="32" cy="32" r="26" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c}"/>
      <text x="32" y="32">${f.percent}%</text>
    </svg>
    <div>
      <div class="score-label">Fidelity${change}</div>
      <div class="counts"><b>${count("ok")}</b> match · <b>${count("differs")}</b> differ · <b>${count("missing")}</b> missing</div>
      <div class="counts">Different pixels: ${(data.mismatch * 100).toFixed(1)} %</div>
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() =>
    document.querySelector(".ring .value").style.strokeDashoffset = c * (1 - f.percent / 100)));
}
$("footer").textContent = "Fidelity: matched elements with no differences, over the matched elements plus the design elements missing from the app. " +
  "Suggestions are hints: the same difference can come from the element or from its container.";

// Imágenes
const viewer = $("viewer");
viewer.style.setProperty("--ar", `${data.width} / ${data.height}`);
viewer.style.setProperty("--pos", "50%");
$("appImg").src = data.images.app;
$("designTop").src = $("designSide").src = data.images.design;
$("diffImg").src = data.images.diff;

// Cajas
const svg = $("boxes");
svg.setAttribute("viewBox", `0 0 ${data.width} ${data.height}`);
svg.setAttribute("preserveAspectRatio", "none");
const ns = "http://www.w3.org/2000/svg";
const rectsByIndex = data.elements.map((e, i) => {
  const rects = [];
  const add = (box, cls) => {
    const r = document.createElementNS(ns, "rect");
    [r.x.baseVal.value, r.y.baseVal.value, r.width.baseVal.value, r.height.baseVal.value] = box;
    r.setAttribute("class", cls);
    r.dataset.index = i;
    svg.appendChild(r);
    rects.push(r);
  };
  if (e.status === "differs") add(e.expected, "expected");
  if (e.actual) add(e.actual, e.status); else add(e.expected, "missing");
  return rects;
});
svg.addEventListener("click", ev => { if (ev.target.dataset.index) select(+ev.target.dataset.index, true); });
$("showBoxes").addEventListener("change", ev => svg.classList.toggle("hidden", !ev.target.checked));

// Modos
const modes = [...$("modes").querySelectorAll("button")];
function setMode(mode) {
  viewer.className = `viewer ${mode}`;
  modes.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("opacityControl").hidden = mode !== "opacity";
}
modes.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("opacity").addEventListener("input", ev => $("designTop").style.opacity = 1 - ev.target.value / 100);
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const i = ["1", "2", "3", "4"].indexOf(ev.key);
  if (i >= 0) setMode(modes[i].dataset.mode);
});

// Deslizador: el diseño se recorta a la izquierda de la manija
const main = $("mainFrame");
let dragging = false;
const move = ev => {
  const r = main.getBoundingClientRect();
  const pos = Math.min(100, Math.max(0, (ev.clientX - r.left) / r.width * 100));
  viewer.style.setProperty("--pos", `${pos}%`);
};
main.addEventListener("pointerdown", ev => {
  if (!viewer.classList.contains("slider") || ev.target.dataset.index) return;
  dragging = true; main.setPointerCapture(ev.pointerId); move(ev);
});
main.addEventListener("pointermove", ev => dragging && move(ev));
main.addEventListener("pointerup", () => dragging = false);
// Antes de deslizar se ve la mitad de cada uno, pero sin la opacidad del modo transparencia
const observer = new MutationObserver(() => $("designTop").style.opacity = viewer.classList.contains("opacity") ? 1 - $("opacity").value / 100 : 1);
observer.observe(viewer, { attributes: true, attributeFilter: ["class"] });
setMode("slider");

// Lista de elementos
const groups = [
  { status: "differs", label: "Differ" },
  { status: "missing", label: "Missing" },
  { status: "ok", label: "Match" },
];
let filter = count("differs") ? "differs" : count("missing") ? "missing" : "ok";
let selected = -1;

function renderFilters() {
  $("filters").innerHTML = groups.map(g =>
    `<button data-status="${g.status}" aria-pressed="${g.status === filter}">${g.label} (${count(g.status)})</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.status; renderFilters(); renderList(); }));
}

function renderList() {
  const items = data.elements.map((e, i) => [e, i]).filter(([e]) => e.status === filter);
  if (!items.length) {
    $("list").innerHTML = `<div class="empty">${filter === "differs" ? "No differences in the matched elements." : "Nothing here."}</div>`;
    return;
  }
  $("list").innerHTML = items.map(([e, i]) => `
    <div class="item${i === selected ? " selected" : ""}" data-index="${i}" tabindex="0">
      <div class="item-head"><span class="dot ${e.status}"></span><span class="name">${esc(e.name)}</span>${e.id ? `<span class="id">${esc(e.id)}</span>` : ""}</div>
      ${e.diffs.length ? `<table><tr><th></th><th>Figma</th><th>App</th></tr>${e.diffs.map(d =>
        `<tr><td>${esc(d.property)}</td><td>${value(d.figma)}</td><td>${value(d.app)}</td></tr>`).join("")}</table>` : ""}
      ${[...new Set(e.diffs.map(d => d.fix).filter(Boolean))].map(fix => `<div class="fix">${md(fix)}</div>`).join("")}
      ${e.fix ? `<div class="fix">${md(e.fix)}</div>` : ""}
    </div>`).join("");
  $("list").querySelectorAll(".item").forEach(el => {
    const i = +el.dataset.index;
    el.addEventListener("click", () => select(i));
    el.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(i); } });
  });
}

function select(i, fromImage = false) {
  selected = selected === i ? -1 : i;
  svg.querySelectorAll("rect.selected").forEach(r => r.classList.remove("selected"));
  svg.classList.toggle("focus", selected >= 0);
  if (selected >= 0) {
    rectsByIndex[selected].forEach(r => { r.classList.add("selected"); svg.appendChild(r); });
    if (fromImage && data.elements[selected].status !== filter) { filter = data.elements[selected].status; renderFilters(); }
  }
  renderList();
  if (selected >= 0 && fromImage) $("list").querySelector(".item.selected")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

renderFilters();
renderList();
</script>
</body>
</html>
